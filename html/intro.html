<!doctype html>
<html lang="ko">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#15151b">


<title>
CHAMVERSE INTRO
</title>


<link rel="stylesheet" href="../css/intro.css">


</head>



<body

class="intro-page"

data-guest-destination="login.html"

data-member-destination="index.html"

>



<main
class="intro-stage"
aria-labelledby="introTitle"
>



<h1
class="sr-only"
id="introTitle"
>
CHAMVERSE
</h1>



<div class="white-screen" aria-hidden="true"></div>

<canvas class="signal-noise" aria-hidden="true"></canvas>

<div class="color-static" aria-hidden="true"></div>

<div class="scanlines" aria-hidden="true"></div>

<div class="tracking-lines" aria-hidden="true"></div>

<div class="screen-vignette" aria-hidden="true"></div>

<div class="tv-beam" aria-hidden="true"></div>

<div class="paper-wash" aria-hidden="true"></div>




<section
class="logo-scene"
aria-hidden="true"
>


<div class="logo-halo"></div>



<div class="logo-shell">


<img

class="logo-image logo-image--white"

src="../images/common/logo.png"

alt="로고"

>



<img

class="logo-image logo-image--color"

src="../images/common/logo.png"

alt="로고"

>


<div class="logo-letters"></div>



</div>


</section>





<p
class="loading-mark"
aria-hidden="true"
>

LOADING <span>···</span>

</p>





<p

class="sr-only"

id="introStatus"

role="status"

aria-live="polite"

>

챔버스 화면을 준비하고 있습니다.

</p>




<button

class="skip-intro"

type="button"

>

건너뛰기

</button>






<noscript>


<div class="noscript-message">


<p>
인트로를 재생하려면 자바스크립트가 필요합니다.
</p>


<a href="login.html">
로그인 화면으로 이동
</a>


</div>


</noscript>





</main>



<script src="../js/intro.js"></script>


</body>
</html>
