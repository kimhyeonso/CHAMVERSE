<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | CHAMVERSE</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
  </head>
  <body class="auth-page login-page" data-page="login" data-static-page="true">
    <!-- 로그인 문구와 입력 항목은 이 HTML에서 직접 수정하세요. -->
    <main class="auth-box">
      <a href="index.html">
        <img class="auth-logo" src="../images/common/logo.png" alt="CHAMVERSE">
      </a>
      <h1>챔버스에 오신 것을 환영해요!</h1>
      <p>더 많은 애니, 더 즐거운 시간이 기다리고 있어요.</p>
      <form id="loginForm">
        <label class="field">
          <span aria-hidden="true">♙</span>
          <input id="loginEmail" type="email" placeholder="이메일 또는 휴대폰 번호" required>
        </label>
        <label class="field">
          <span aria-hidden="true">♙</span>
          <input id="loginPassword" type="password" placeholder="비밀번호" required>
        </label>
        <button class="primary-btn" type="submit">로그인</button>
      </form>
      <div class="auth-links">
        <a href="signup.html">회원가입</a>
        <a href="main.html">간편 로그인</a>
      </div>
      <div class="divider"></div>
      <p class="safe-copy">♡　안심하고 시청하세요</p>
      <small>챔버스는 안전하고 쾌적한 시청 환경을 제공합니다.</small>
    </main>
    <script src="../js/common.js"></script>
    <script src="../js/app-utils.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
