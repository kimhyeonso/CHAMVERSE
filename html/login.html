<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>로그인 | CHAMVERSE</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
  </head>

  <body
    class="auth-page login-page"
    data-page="login"
    data-static-page="true"
  >
    <main class="auth-box">
      <a
        class="logo-link"
        href="index.html"
        aria-label="CHAMVERSE 홈으로 이동"
      >
        <img
          class="auth-logo"
          src="../images/common/logo.png"
          alt="CHAMVERSE"
        >
      </a>

      <h1>챔버스에 오신 것을 환영해요!</h1>

      <p class="intro-copy">
        더 많은 애니, 더 즐거운 시간이 기다리고 있어요.
      </p>

      <form id="loginForm" novalidate>
        <label class="field">
          <svg
            class="field-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5.5 20c.7-4 2.8-6 6.5-6s5.8 2 6.5 6"></path>
          </svg>

          <span class="sr-only">
            이메일 또는 휴대폰 번호
          </span>

          <input
            id="loginEmail"
            type="text"
            inputmode="email"
            autocomplete="username"
            placeholder="이메일 또는 휴대폰 번호"
            required
          >
        </label>

        <label class="field">
          <svg
            class="field-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect
              x="5.5"
              y="10"
              width="13"
              height="10"
              rx="2"
            ></rect>

            <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"></path>
            <path d="M12 14.5v2"></path>
          </svg>

          <span class="sr-only">
            비밀번호
          </span>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="비밀번호"
            required
          >

          <button
            class="password-toggle"
            type="button"
            aria-label="비밀번호 표시"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.2-5 9.5-5 9.5 5 9.5 5-3.2 5-9.5 5-9.5-5-9.5-5Z"></path>
              <circle cx="12" cy="12" r="2.5"></circle>

              <path
                class="password-toggle__slash"
                d="M4 4l16 16"
              ></path>
            </svg>
          </button>
        </label>

        <p
          class="auth-message"
          id="loginMessage"
          role="alert"
          hidden
        ></p>

        <button class="primary-btn" type="submit">
          로그인
        </button>
      </form>

      <div class="auth-links">
        <a href="signup.html">
          회원가입
        </a>

        <span aria-hidden="true"></span>

        <button
          class="social-login-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="socialLoginPanel"
        >
          간편 로그인

          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="m6 8 4 4 4-4"></path>
          </svg>
        </button>
      </div>

      <section
        class="social-login-panel"
        id="socialLoginPanel"
        aria-label="간편 로그인"
        aria-hidden="true"
      >
        <div class="social-login-panel__clip">
          <div class="social-login-panel__surface">
            <p>
              가입할 때 연동한 계정으로 로그인하세요.
            </p>

            <button
              class="social-login kakao"
              type="button"
              data-provider="kakao"
            >
              <span
                class="social-login__icon social-login__icon--image"
                aria-hidden="true"
              >
                <img
                  class="social-login__image social-login__image--kakao"
                  src="https://cdn-icons-png.flaticon.com/512/2111/2111466.png"
                  alt=""
                  referrerpolicy="no-referrer"
                >
              </span>

              <span>카카오톡으로 로그인</span>
            </button>

            <button
              class="social-login naver"
              type="button"
              data-provider="naver"
            >
              <span
                class="social-login__icon"
                aria-hidden="true"
              >
                N
              </span>

              <span>네이버로 로그인</span>
            </button>

            <button
              class="social-login google"
              type="button"
              data-provider="google"
            >
              <span
                class="social-login__icon social-login__icon--image"
                aria-hidden="true"
              >
                <img
                  class="social-login__image social-login__image--google"
                  src="https://cdn.iconscout.com/icon/free/png-256/free-google-icon-svg-download-png-189824.png?f=webp&amp;w=128"
                  alt=""
                  referrerpolicy="no-referrer"
                >
              </span>

              <span>구글로 로그인</span>
            </button>
          </div>
        </div>
      </section>

      <div class="divider"></div>

      <div class="safe-area">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 5 6v5c0 4.6 2.7 8.2 7 10 4.3-1.8 7-5.4 7-10V6l-7-3Z"></path>
          <path d="m9.5 12 1.7 1.7 3.6-3.7"></path>
        </svg>

        <div>
          <p class="safe-copy">
            안심하고 시청하세요
          </p>

          <small>
            챔버스는 안전하고 쾌적한 시청 환경을 제공합니다.
          </small>
        </div>
      </div>
    </main>

    <script src="../js/common.js"></script>
    <script src="../js/app-utils.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
