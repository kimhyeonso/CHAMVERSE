<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>검색 | CHAMVERSE</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/search.css">
  </head>
<body data-page="search" data-static-page="true" data-use-common-ui="true">
    <div class="app">
      <main class="page">
        <header class="screen-header compact">
          <a class="back" href="main.html">‹</a>
          <span>CHAMVERSE</span>
        </header>
        <section class="search-intro" aria-labelledby="searchPageTitle">
          <div class="title-with-icon">
            <h1 id="searchPageTitle">콘텐츠 검색</h1>
            <span class="section-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 4 4"></path></svg>
            </span>
          </div>
          <p>보고 싶은 작품이나 캐릭터를 빠르게 찾아보세요.</p>
        </section>
        <form class="search-box" id="searchForm">
          <input id="searchInput" aria-label="검색어" placeholder="작품명, 캐릭터명을 검색해보세요.">
          <button type="submit" aria-label="검색">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 4 4"></path></svg>
          </button>
        </form>
        <section class="history">
          <h2>최근 검색어</h2>
          <ul id="historyList">
            <li>
              신비아파트
              <button>×</button>
            </li>
            <li>
              명탐정 코난
              <button>×</button>
            </li>
            <li>
              노진구
              <button>×</button>
            </li>
          </ul>
        </section>
        <section class="search-trending">
          <h2 class="section-title">지금 많이 찾고 있어요</h2>
          <div id="trendingList" class="card-row"></div>
        </section>
        <section id="searchResultSection" class="section" hidden>
          <h2 class="section-title">검색 결과</h2>
          <div id="searchResults" class="wish-grid"></div>
        </section>
      </main>
    </div>
  <script src="../js/common.js"></script>
  <script src="../js/app-utils.js"></script>
    <script src="../js/search.js"></script>
  </body>
</html>
