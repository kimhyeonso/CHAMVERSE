<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>콘텐츠 상세 | CHAMVERSE</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/play.css">
  </head>
<body data-page="play" data-static-page="true" data-use-common-ui="true">
    <div class="app">
      <main class="page">
        <header class="screen-header">
          <a class="back" href="main.html">‹</a>
          <img class="brand" src="../images/common/logo.png" alt="CHAMVERSE">
        </header>
        <button id="playBackButton" class="play-back-button" type="button" aria-label="이전 페이지로 돌아가기">×</button>
        <section id="playHero" class="banner-play">
          <div>
            <h1 id="playTitle">작품 제목</h1>
            <div id="playMeta" class="meta light"></div>
          </div>
        </section>
        <section class="section">
          <p id="playDescription" class="description">작품 설명을 불러오는 중입니다.</p>
          <div class="action-grid">
            <button id="playButton" class="primary-btn">▶　재생하기</button>
            <button id="wishButton" class="secondary-btn">♡　찜하기</button>
          </div>
          <div class="feature-actions">
            <button id="downloadAction" data-action="download" type="button">
              <img id="downloadActionIcon" class="feature-icon" src="../images/play/icon-11.png" alt="">
              <span id="downloadActionLabel">다운로드</span>
            </button>
            <button data-action="share" type="button">
              <img class="feature-icon" src="../images/play/icon-10.png" alt="">
              <span>공유</span>
            </button>
            <button data-action="rating">
              <b id="ratingScore">평점</b>
              평가
            </button>
          </div>
        </section>
        <section class="section">
          <div class="episode-heading">
            <h2 class="section-title">에피소드</h2>
            <select id="seasonSelect" aria-label="시즌 선택"></select>
          </div>
          <div id="episodeList" class="episode-list"></div>
        </section>
      </main>
    </div>
  <script src="../js/common.js"></script>
  <script src="../js/app-utils.js"></script>
    <script src="../js/play.js"></script>
  </body>
</html>
