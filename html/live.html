<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>라이브 | CHAMVERSE</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/live.css">
  </head>
<body data-page="live" data-static-page="true" data-use-common-ui="true">
    <div class="app">
      <main class="page">
        <header class="screen-header compact">
          <a class="back" href="main.html">‹</a>
          <span>
            CHAMVERSE
            <b>LIVE</b>
          </span>
        </header>
        <div class="live-layout">
          <section class="live-primary" aria-labelledby="liveTitle">
            <div class="live-video">
              <video id="livePlayer" poster="../images/contents/id-01.jpg" preload="metadata" playsinline>
                <source src="../images/live/onepiece-live.mp4" type="video/mp4">
                브라우저가 영상 재생을 지원하지 않습니다.
              </video>
              <span class="live-badge">LIVE <i aria-hidden="true"></i></span>
              <span class="viewer-count">라이브 시청 중</span>
              <button id="livePlayButton" class="play-mark" type="button" aria-label="원피스 라이브 영상 재생"><i aria-hidden="true"></i></button>
            </div>
            <div class="live-info">
              <span class="tag live-now">현재 방송 중</span>
              <h1 id="liveTitle" class="section-title">라이브 콘텐츠</h1>
              <p id="liveDescription" class="description"></p>
              <div class="meta" aria-label="방송 진행 시간">
                <span id="liveElapsed">12:50:00</span>
                <div id="liveProgress" class="progress" role="progressbar" aria-label="라이브 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75">
                  <span id="liveProgressBar"></span>
                </div>
                <span>13:00:00</span>
              </div>
            </div>
          </section>
          <section class="schedule-section" aria-labelledby="scheduleTitle">
            <div class="schedule-heading">
              <div class="schedule-title">
                <h2 id="scheduleTitle">오늘의 편성</h2>
                <span class="section-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"></circle><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M5.5 5.5a9.2 9.2 0 0 0 0 13M18.5 5.5a9.2 9.2 0 0 1 0 13"></path></svg>
                </span>
              </div>
              <div class="schedule-tools">
                <span class="schedule-note">이어지는 방송</span>
                <div class="schedule-controls" aria-label="편성표 이동">
                  <button id="schedulePrev" type="button" aria-label="이전 편성">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
                  </button>
                  <button id="scheduleNext" type="button" aria-label="다음 편성">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
                  </button>
                </div>
              </div>
            </div>
            <div id="scheduleList" class="schedule"></div>
          </section>
        </div>
      </main>
    </div>
  <script src="../js/common.js"></script>
  <script src="../js/app-utils.js"></script>
    <script src="../js/live.js"></script>
  </body>
</html>
