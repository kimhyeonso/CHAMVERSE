<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메인 | CHAMVERSE</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/main.css">
  </head>
<body data-page="main" data-static-page="true" data-use-common-ui="true">
    <div class="app main-static-page">
      <main class="mobile-shell">
        <header class="screen-header">
          <a href="main.html">
            <img class="brand" src="../images/common/logo.png" alt="CHAMVERSE">
          </a>
          <div class="header-actions">
            <a class="icon-button" href="search.html">⌕</a>
            <a class="profile-dot" href="myPage.html">☺</a>
          </div>
        </header>
        <div class="shell main-page">
          <section class="hero">
            <div class="eyebrow">이번 주의 Pick!</div>
            <div class="hero-copy">
              <h1 id="heroTitle">이번 주 추천 애니</h1>
              <p id="heroDescription">콘텐츠 데이터를 불러오는 중입니다.</p>
              <div class="button-row">
                <a id="heroPlay" class="secondary-btn" href="play.html">▶ 지금 보기</a>
                <button id="heroWish" class="secondary-btn">＋ 찜하기</button>
              </div>
            </div>
            <div class="dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </section>
          <section class="section">
            <h2 class="section-title">TOP 10 시리즈</h2>
            <div id="topTenList" class="card-row"></div>
          </section>
          <section class="section">
            <h2 class="section-title">이어볼까요?</h2>
            <div id="continueList" class="card-row"></div>
          </section>
          <section class="section event-card">
            <div>
              <h3>내 최애를 골라줘!</h3>
              <p>
                캐릭터 투표에 참여하고
                <br>
                나만의 응원권도 받아보세요.
              </p>
            </div>
            <a class="primary-btn" href="voteEvent.html">투표하러 가기</a>
          </section>
          <section class="section">
            <h2 class="section-title">장르 탐색</h2>
            <div class="chips">
              <button class="chip active">전체</button>
              <button class="chip">일상</button>
              <button class="chip">코미디</button>
              <button class="chip">액션</button>
            </div>
            <div id="genreList" class="card-row"></div>
          </section>
        </div>
      </main>
      <nav class="bottom-nav">
        <div class="nav-inner">
          <a class="active" href="main.html">
            <img src="../images/common/icon-01-on.png" alt="">
            홈
          </a>
          <a href="live.html">
            <img src="../images/common/icon-02.png" alt="">
            라이브
          </a>
          <a href="wish.html">
            <img src="../images/common/icon-03.png" alt="">
            찜
          </a>
          <a href="myPage.html">
            <img src="../images/common/icon-04.png" alt="">
            마이
          </a>
        </div>
      </nav>
    </div>
  <script src="../js/common.js"></script>
  <script src="../js/app-utils.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
