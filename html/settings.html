<!doctype html>

<body data-page="settings" data-static-page="true" data-use-common-ui="true">

              <button class="toggle">
                <span></span>
              </button>
            </div>
          </div>

        <section class="settings-group">
          <h2>앱 환경 설정</h2>
          <div class="menu-list">
            <div class="menu-row">
              <b>다크 모드</b>

          <div class="menu-list">

            <a class="menu-row" href="notice.html">

            <a class="menu-row" href="notice.html">

              <b>›</b>
            </a>
            <a class="menu-row" href="notice.html">
              개인정보처리방침
              <b>›</b>
            </a>
          </div>
        </section>
        <section class="settings-group settings-account-actions">
          <p>앱 버전 1.0.0</p>
          <button id="logoutButton">로그아웃</button>
          <button id="withdrawButton">회원 탈퇴</button>
        </section>
      </main>
